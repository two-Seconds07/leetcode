name: Sync LeetCode Submissions

on:
  schedule:
    # 每小时的第 0 分钟触发（即每小时整点）
    - cron: '0 * * * *'
  workflow_dispatch: # 保留手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 👇 关键修改1：拉取代码时，就使用你生成的 PAT 身份
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Sync LeetCode submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python sync_leetcode.py

      - name: Commit and push changes
        run: |
          git config user.name "Liuliu0917"
          git config user.email "Liuliu0917@users.noreply.github.com"
          git add solutions/
          if git diff --staged --quiet; then
            echo "没有新的变更"
          else
            git commit -m "Sync LeetCode submissions"
            # 👇 关键修改2：确保 push 时使用带 token 的远程地址（其实上面 with 里配置了就够了，但这更稳妥）
            git push origin main
          fi
